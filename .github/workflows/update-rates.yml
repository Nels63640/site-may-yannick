name: Mise à jour automatique des taux ANAH

on:
  schedule:
    - cron: '0 7 1 * *'    # Le 1er de chaque mois à 7h UTC
  workflow_dispatch:         # Déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run rates updater
        run: python update_rates.py
        continue-on-error: true   # On commit rates-status.json même en cas d'erreur

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json rates-status.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "bot: mise à jour automatique des taux ANAH [skip ci]"
          git push
